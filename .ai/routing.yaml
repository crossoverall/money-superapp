version: 1

# ==============================================================================
# Model Tier Definitions & Provider Mappings
# ==============================================================================
model_tiers:
  fast:
    description: "Low-latency, high-throughput, lowest-cost model for mechanical tasks, linting, file lookups"
    providers:
      gemini: "gemini-3.8-flash-low"    # Antigravity CLI: gemini-3.8-flash-low (Subagent: flash_lite)
      anthropic: "claude-3-5-haiku"
      openai: "gpt-4o-mini"
    cost_tier: "$"

  standard:
    description: "Balanced reasoning and coding model for routine implementation, testing, and reviews"
    providers:
      gemini: "gemini-3.8-flash-high"   # Antigravity CLI: gemini-3.8-flash-high (Subagent: flash)
      anthropic: "claude-3-5-sonnet"
      openai: "gpt-4o"
    cost_tier: "$$"

  frontier:
    description: "Maximum reasoning capacity for high-stakes architecture, subtle concurrency, security audits"
    providers:
      gemini: "gemini-3.1-pro-high"     # Antigravity CLI: gemini-3.1-pro-high (Subagent: pro)
      anthropic: "claude-3-opus"
      openai: "o1"
    cost_tier: "$$$"

# ==============================================================================
# Operational Guardrails & Circuit Breakers
# ==============================================================================
guardrails:
  circuit_breaker:
    max_feedback_loops: 2       # Max iterations between Coder, QA, and Reviewer before human escalation
    action_on_breach: "abort_and_escalate"
  
  task_slicing:
    max_files_per_slice: 5      # Maximum files touched in a single task slice
    max_lines_per_slice: 200    # Maximum lines modified per slice
    enforce_vertical_slices: true
  
  human_in_the_loop:
    plan_approval_required:     # Stages requiring explicit user sign-off before coding starts
      - "level_2"
      - "level_3"
    level_1_autonomous: true    # Level 1 mechanical tasks proceed autonomously
  
  safety_and_isolation:
    pre_flight_check: true      # Verify clean git status & passing tests before coding
    protect_ai_context: true    # Ensure .ai/ directory is never wiped during rollback
    rollback_command: "git checkout -- <changed_source_files>" # Target only application files

  mandatory_full_sdlc_for_fixes:
    enforced: true
    description: "Whenever the user asks to fix anything on the project, the agent MUST execute the full SDLC pipeline: Intake -> Plan -> HITL Approval -> Code -> QA Verification -> Security Review -> Release. Never bypass QA or Security Review."

# ==============================================================================
# Workload Complexity Taxonomy & Routing Rules
# ==============================================================================
complexity_levels:
  level_1:
    name: "Minor / Mechanical"
    description: "Typo fixes, styling tweaks, minor string edits, formatting, docs (< 20 lines)"
    pipeline: ["orchestrator", "coder", "debugger", "release"]
    model_assignment:
      orchestrator: "fast"
      planner: "skip"
      coder: "fast"
      debugger: "fast"
      reviewer: "skip"
      release: "fast"

  level_2:
    name: "Standard Feature / Bug"
    description: "New UI components, new API endpoints, isolated refactor, calculation bugfix, test authoring"
    pipeline: ["orchestrator", "planner", "approval_gate", "coder", "debugger", "reviewer", "release"]
    model_assignment:
      orchestrator: "standard"
      planner: "standard"
      coder: "standard"
      debugger: "fast"
      reviewer: "standard"
      release: "fast"

  level_3:
    name: "Architectural / Critical"
    description: "Cross-cutting refactors, auth/security redesigns, concurrency/state machine changes, core math/algorithms"
    pipeline: ["orchestrator", "planner", "approval_gate", "coder", "debugger", "reviewer", "release"]
    model_assignment:
      orchestrator: "frontier"
      planner: "frontier"
      coder: "standard"
      debugger: "standard"
      reviewer: "frontier"
      release: "fast"

# ==============================================================================
# Triage Classification Rules (Heuristics)
# ==============================================================================
heuristics:
  force_full_sdlc_on_fixes:
    description: "Mandatory rule: Any request from user to fix code, bugs, UI, calculations, localization, or defects in the project must execute full SDLC and never bypass QA or Security Review"
    keywords: ["fix", "bug", "issue", "error", "patch", "broken", "incorrect", "problem", "solve", "repair", "defect", "fail", "localization", "crash", "wrong"]
    target_pipeline: ["orchestrator", "planner", "approval_gate", "coder", "debugger", "reviewer", "release"]
    minimum_level: "level_2"
  force_level_3:
    - path_matches: ["*auth*", "*security*", "*crypto*", "*migrations*", "*core*"]
    - keywords: ["security", "vulnerability", "concurrency", "deadlock", "architectural change", "database migration"]
  force_level_1:
    - path_matches: ["*.md", "*.txt", "*docs/*"]
    - keywords: ["typo", "rename", "format", "whitespace", "bump version", "comment"]
