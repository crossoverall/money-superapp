<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="version" content="0.1.0">
<meta name="description" content="Money Superapp — four financial calculators (rebalance, payslip simulator, income tax, PVD tax) in Thai and English with light/dark theme.">
<title>Money Superapp</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f5f7; display: flex; flex-direction: column; }

  /* Full-bleed dark background bar; its content is capped and centered so tabs
     don't stretch into huge gaps on ultra-wide monitors. */
  .topbar { flex: 0 0 auto; background: #1f2937; }
  .topbar-inner {
    max-width: 1280px; margin: 0 auto; display: flex; align-items: stretch;
  }

  /* Tabs scroll horizontally instead of wrapping, so the bar's height never
     changes with screen width (that's what keeps the iframe below sized right). */
  nav { display: flex; flex: 1 1 auto; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  nav button {
    flex: 0 0 auto; white-space: nowrap; padding: 14px 16px; border: none; background: none;
    color: #cbd5e1; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent;
  }
  nav button:hover { background: #374151; }
  nav button.active { color: #fff; border-bottom-color: #38bdf8; background: #111827; }

  .lang-toggle, .theme-toggle {
    display: flex; align-items: center; gap: 4px; padding: 0 10px; flex: 0 0 auto;
  }
  .theme-toggle { border-left: 1px solid #374151; }
  .version-badge {
    flex: 0 0 auto; padding: 0 10px; font-size: 11px; font-weight: 600;
    color: #94a3b8; letter-spacing: 0.05em;
  }
  .lang-toggle button, .theme-toggle button {
    border: 1px solid #4b5563; background: none; color: #cbd5e1; white-space: nowrap;
    font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 999px; cursor: pointer;
  }
  .lang-toggle button.active, .theme-toggle button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

  iframe { display: block; width: 100%; flex: 1 1 auto; border: none; background: #fff; }
</style>
</head>
<body>
<div class="topbar">
 <div class="topbar-inner">
  <nav>
    <button class="active" data-src="rebalance.html" data-th="คำนวณ Rebalance" data-en="Rebalance Calculator">Rebalance Calculator</button>
    <button data-src="months-slips.html" data-th="จำลองสลิปเงินเดือน" data-en="Payslip Simulator">Months Slips Calculator</button>
    <button data-src="tax-calculator-base.html" data-th="ประมาณการภาษีเงินได้" data-en="Income Tax Estimation">Income Tax Estimation</button>
    <button data-src="tax-calculator.html" data-th="คำนวณภาษี PVD" data-en="PVD Tax Calculator">PVD Tax Calculator</button>
    <button data-src="remaining-money.html" data-th="คำนวณเงินคงเหลือ" data-en="Remaining Money">Remaining Money</button>
  </nav>
  <div class="lang-toggle">
    <button data-lang="th">TH</button>
    <button data-lang="en">EN</button>
  </div>
  <div class="theme-toggle">
    <button data-theme-btn="light" data-th="☀ สว่าง" data-en="☀ Light">☀ Light</button>
    <button data-theme-btn="dark" data-th="☾ มืด" data-en="☾ Dark">☾ Dark</button>
  </div>
  <span class="version-badge">v0.1</span>
 </div>
</div>
<iframe id="app" src="rebalance.html"></iframe>
<script>
  const frame = document.getElementById('app');
  const navButtons = document.querySelectorAll('nav button');
  const langButtons = document.querySelectorAll('.lang-toggle button');
  const themeButtons = document.querySelectorAll('.theme-toggle button');

  function getLang(){ try { return localStorage.getItem('moneySuperapp.lang') || 'th'; } catch(e){ return 'th'; } }
  function getTheme(){ try { return localStorage.getItem('moneySuperapp.theme') || 'light'; } catch(e){ return 'light'; } }
  function applyLang(lang){
    langButtons.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    navButtons.forEach(b => b.textContent = b.dataset[lang]);
    themeButtons.forEach(b => b.textContent = b.dataset[lang]);
    document.documentElement.lang = lang;
  }
  function applyTheme(theme){
    themeButtons.forEach(b => b.classList.toggle('active', b.dataset.themeBtn === theme));
  }
  // Each app page reads lang/theme from localStorage once on load, so reload the
  // currently displayed one whenever either changes.
  function reloadFrame(){
    try { frame.contentWindow.location.reload(); } catch(e){ frame.src = frame.src; }
  }

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('nav button.active').classList.remove('active');
      btn.classList.add('active');
      frame.src = btn.dataset.src;
    });
  });

  langButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      try { localStorage.setItem('moneySuperapp.lang', lang); } catch(e){}
      applyLang(lang);
      reloadFrame();
    });
  });

  themeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const theme = btn.dataset.themeBtn;
      try { localStorage.setItem('moneySuperapp.theme', theme); } catch(e){}
      applyTheme(theme);
      reloadFrame();
    });
  });

  applyLang(getLang());
  applyTheme(getTheme());
</script>
</body>
</html>
