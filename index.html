<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Money Superapp</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; }
  .topbar { display: flex; align-items: stretch; background: #1f2937; }
  nav { display: flex; flex-wrap: wrap; flex: 1; }
  nav button {
    flex: 1; min-width: 140px; padding: 14px 10px; border: none; background: none;
    color: #cbd5e1; font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent;
  }
  nav button:hover { background: #374151; }
  nav button.active { color: #fff; border-bottom-color: #38bdf8; background: #111827; }
  .lang-toggle { display: flex; align-items: center; gap: 4px; padding: 0 12px; flex-shrink: 0; }
  .lang-toggle button {
    border: 1px solid #4b5563; background: none; color: #cbd5e1;
    font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .lang-toggle button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
  iframe { display: block; width: 100%; height: calc(100vh - 52px); border: none; background: #fff; }
</style>
</head>
<body>
<div class="topbar">
  <nav>
    <button class="active" data-src="rebalance.html" data-th="คำนวณ Rebalance" data-en="Rebalance Calculator">Rebalance Calculator</button>
    <button data-src="months-slips.html" data-th="จำลองสลิปเงินเดือน" data-en="Payslip Simulator">Months Slips Calculator</button>
    <button data-src="tax-calculator-base.html" data-th="คำนวณภาษีเบื้องต้น" data-en="Tax Calculator (Base)">Tax Calculator (Base)</button>
    <button data-src="tax-calculator.html" data-th="คำนวณภาษีเงินชดเชย" data-en="Tax Calculator">Tax Calculator</button>
  </nav>
  <div class="lang-toggle">
    <button data-lang="th">TH</button>
    <button data-lang="en">EN</button>
  </div>
</div>
<iframe id="app" src="rebalance.html"></iframe>
<script>
  const frame = document.getElementById('app');
  const navButtons = document.querySelectorAll('nav button');
  const langButtons = document.querySelectorAll('.lang-toggle button');

  function getLang(){ try { return localStorage.getItem('moneySuperapp.lang') || 'th'; } catch(e){ return 'th'; } }
  function applyLang(lang){
    langButtons.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    navButtons.forEach(b => b.textContent = b.dataset[lang]);
  }

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('nav button.active').classList.remove('active');
      btn.classList.add('active');
      frame.src = btn.dataset.src;
    });
  });

  langButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const lang = btn.dataset.lang;
      try { localStorage.setItem('moneySuperapp.lang', lang); } catch(e){}
      applyLang(lang);
      // Each app page reads the language from localStorage once on load, so reload
      // the currently displayed one to pick up the change.
      try { frame.contentWindow.location.reload(); } catch(e){ frame.src = frame.src; }
    });
  });

  applyLang(getLang());
</script>
</body>
</html>
