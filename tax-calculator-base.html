<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณภาษีเงินได้บุคคลธรรมดา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }

        [data-theme="dark"] body { background-color: #0f172a !important; }
        [data-theme="dark"] .bg-white { background-color: #1e293b !important; }
        [data-theme="dark"] .bg-gray-100 { background-color: #0f172a !important; }
        [data-theme="dark"] .bg-blue-50 { background-color: #17304d !important; }
        [data-theme="dark"] .border,
        [data-theme="dark"] .border-blue-100,
        [data-theme="dark"] hr.border-gray-200 { border-color: #334155 !important; }
        [data-theme="dark"] .text-gray-800,
        [data-theme="dark"] .text-gray-900 { color: #e2e8f0 !important; }
        [data-theme="dark"] .text-gray-700,
        [data-theme="dark"] .text-gray-600,
        [data-theme="dark"] .text-gray-500 { color: #94a3b8 !important; }
        [data-theme="dark"] .text-blue-800 { color: #93c5fd !important; }
        [data-theme="dark"] input { background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #334155 !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center" id="lbl-title">คำนวณภาษีเบื้องต้น 📊</h2>

        <!-- Input Section -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" id="lbl-salary">เงินเดือน (บาท/เดือน)</label>
                <input type="number" id="salary" placeholder="เช่น 50000" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculateTax()">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" id="lbl-bonus">โบนัส (บาท/ปี)</label>
                <input type="number" id="bonus" placeholder="เช่น 100000" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculateTax()">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" id="lbl-pvdPercent">กองทุนสำรองเลี้ยงชีพ (%)</label>
                <input type="number" id="pvd" placeholder="เช่น 5" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" oninput="calculateTax()">
            </div>
        </div>

        <hr class="my-6 border-gray-200">

        <!-- Result Section -->
        <div class="space-y-3 text-sm text-gray-600">
            <div class="flex justify-between">
                <span id="lbl-totalIncome">รายได้รวมทั้งปี:</span>
                <span id="totalIncome" class="font-medium text-gray-900">0 บาท</span>
            </div>
            <div class="flex justify-between">
                <span id="lbl-expenseDeduct">หักค่าใช้จ่าย (สูงสุด 100,000):</span>
                <span id="expenseDeduct" class="font-medium text-red-500">- 0 บาท</span>
            </div>
            <div class="flex justify-between">
                <span id="lbl-personalDeduct">หักค่าลดหย่อนส่วนตัว:</span>
                <span class="font-medium text-red-500" id="personalDeductVal">- 60,000 บาท</span>
            </div>
            <div class="flex justify-between">
                <span id="lbl-pvdDeduct">หักกองทุนสำรองเลี้ยงชีพ (PVD):</span>
                <span id="pvdDeduct" class="font-medium text-red-500">- 0 บาท</span>
            </div>
            <div class="flex justify-between">
                <span id="lbl-ssoDeduct">หักประกันสังคม (ทั้งปี):</span>
                <span id="ssoDeduct" class="font-medium text-red-500">- 0 บาท</span>
            </div>

            <div class="border-t pt-3 mt-3 flex justify-between items-center text-base">
                <span class="font-semibold text-gray-800" id="lbl-netIncome">เงินได้สุทธิ:</span>
                <span id="netIncome" class="font-semibold text-blue-600">0 บาท</span>
            </div>
        </div>

        <div class="mt-6 bg-blue-50 p-4 rounded-xl border border-blue-100 text-center">
            <span class="block text-sm text-blue-800 mb-1" id="lbl-taxAmount">ภาษีที่ต้องชำระโดยประมาณ</span>
            <span id="taxAmount" class="text-3xl font-bold text-blue-600">0</span>
            <span class="text-blue-800 font-medium" id="unitLabel"> บาท</span>
        </div>

        <div class="mt-4">
            <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2" id="lbl-breakdownTitle">รายละเอียดภาษีตามขั้นบันได</p>
            <div id="taxBreakdown" class="space-y-1 text-xs text-gray-600"></div>
        </div>
    </div>

    <script>
        // Language: read once from localStorage (shared origin with the shell nav's toggle).
        const LANG = (function(){ try { return localStorage.getItem('moneySuperapp.lang') || 'th'; } catch(e){ return 'th'; } })();
        document.documentElement.lang = LANG;
        document.documentElement.dataset.theme = (function(){ try { return localStorage.getItem('moneySuperapp.theme') || 'light'; } catch(e){ return 'light'; } })();
        const unit = LANG === 'en' ? 'THB' : 'บาท';
        if (LANG === 'en') {
            document.title = 'Personal Income Tax Calculator';
            const EN = {
                'lbl-title': 'Tax Estimate 📊',
                'lbl-salary': 'Salary (THB/month)',
                'lbl-bonus': 'Bonus (THB/year)',
                'lbl-pvdPercent': 'Provident Fund (%)',
                'lbl-totalIncome': 'Total annual income:',
                'lbl-expenseDeduct': 'Expense deduction (up to 100,000):',
                'lbl-personalDeduct': 'Personal allowance:',
                'lbl-pvdDeduct': 'Provident Fund (PVD) deduction:',
                'lbl-ssoDeduct': 'Social Security deduction (annual):',
                'lbl-netIncome': 'Net taxable income:',
                'lbl-taxAmount': 'Estimated tax payable',
                'lbl-breakdownTitle': 'Tax breakdown by bracket',
            };
            Object.keys(EN).forEach(id => { document.getElementById(id).textContent = EN[id]; });
            document.getElementById('personalDeductVal').textContent = '- 60,000 THB';
            document.getElementById('unitLabel').textContent = ' THB';
            // Default zero-value text is baked into the markup with the THB unit inline;
            // it only gets recalculated (and re-translated) once the user types something.
            document.getElementById('totalIncome').textContent = '0 THB';
            document.getElementById('expenseDeduct').textContent = '- 0 THB';
            document.getElementById('pvdDeduct').textContent = '- 0 THB';
            document.getElementById('ssoDeduct').textContent = '- 0 THB';
            document.getElementById('netIncome').textContent = '0 THB';
            const placeholders = { salary: 'e.g. 50000', bonus: 'e.g. 100000', pvd: 'e.g. 5' };
            Object.keys(placeholders).forEach(id => {
                document.getElementById(id).placeholder = placeholders[id];
            });
        }

        function formatMoney(amount) {
            return amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function calculateTax() {
            // ดึงค่าจาก Input
            const salary = parseFloat(document.getElementById('salary').value) || 0;
            const bonus = parseFloat(document.getElementById('bonus').value) || 0;
            const pvdPercent = parseFloat(document.getElementById('pvd').value) || 0;

            // คำนวณรายได้
            const totalIncome = (salary * 12) + bonus;

            // คำนวณค่าลดหย่อน
            const expenseDeduction = Math.min(totalIncome * 0.5, 100000);
            const personalDeduction = 60000;
            // คิด PVD จากฐานเงินเดือนเท่านั้น (ไม่รวมโบนัส) ตามหลักการทั่วไป
            const pvdDeduction = (salary * 12) * (pvdPercent / 100);

            // ประกันสังคม (5% ของเงินเดือน สูงสุด 875 บาท/เดือน) — เช่นเดียวกับที่ใช้ใน months-slips.html
            let ssoMonthly = salary * 0.05;
            if (ssoMonthly > 875) ssoMonthly = 875;
            const ssoDeduction = ssoMonthly * 12;

            // คำนวณเงินได้สุทธิ
            const totalDeductions = expenseDeduction + personalDeduction + pvdDeduction + ssoDeduction;
            let netIncome = totalIncome - totalDeductions;
            if (netIncome < 0) netIncome = 0;

            // ตารางอัตราภาษี (ขั้นบันได)
            const brackets = [
                { limit: 150000, rate: 0,    labelTh: '0 - 150,000',             labelEn: '0 - 150,000' },
                { limit: 150000, rate: 0.05, labelTh: '150,001 - 300,000',       labelEn: '150,001 - 300,000' },
                { limit: 200000, rate: 0.10, labelTh: '300,001 - 500,000',       labelEn: '300,001 - 500,000' },
                { limit: 250000, rate: 0.15, labelTh: '500,001 - 750,000',       labelEn: '500,001 - 750,000' },
                { limit: 250000, rate: 0.20, labelTh: '750,001 - 1,000,000',     labelEn: '750,001 - 1,000,000' },
                { limit: 1000000, rate: 0.25, labelTh: '1,000,001 - 2,000,000',  labelEn: '1,000,001 - 2,000,000' },
                { limit: 3000000, rate: 0.30, labelTh: '2,000,001 - 5,000,000',  labelEn: '2,000,001 - 5,000,000' },
                { limit: Infinity, rate: 0.35, labelTh: '5,000,001 ขึ้นไป',      labelEn: 'Over 5,000,000' }
            ];

            let tax = 0;
            let remainingIncome = netIncome;
            const breakdown = [];

            // คำนวณภาษีตามขั้นบันได
            for (let i = 0; i < brackets.length; i++) {
                if (remainingIncome <= 0) break;

                const taxableAtThisBracket = Math.min(remainingIncome, brackets[i].limit);
                const taxAtThisBracket = taxableAtThisBracket * brackets[i].rate;
                tax += taxAtThisBracket;
                remainingIncome -= taxableAtThisBracket;
                breakdown.push({ bracket: brackets[i], taxable: taxableAtThisBracket, tax: taxAtThisBracket });
            }

            const breakdownEl = document.getElementById('taxBreakdown');
            breakdownEl.innerHTML = breakdown.map(b => {
                const label = LANG === 'en' ? b.bracket.labelEn : b.bracket.labelTh;
                return `<div class="flex justify-between"><span>${label} (${(b.bracket.rate * 100).toFixed(0)}%)</span><span class="font-medium">${formatMoney(b.tax)} ${unit}</span></div>`;
            }).join('');

            // แสดงผลลัพธ์
            document.getElementById('totalIncome').innerText = formatMoney(totalIncome) + ' ' + unit;
            document.getElementById('expenseDeduct').innerText = '- ' + formatMoney(expenseDeduction) + ' ' + unit;
            document.getElementById('pvdDeduct').innerText = '- ' + formatMoney(pvdDeduction) + ' ' + unit;
            document.getElementById('ssoDeduct').innerText = '- ' + formatMoney(ssoDeduction) + ' ' + unit;
            document.getElementById('netIncome').innerText = formatMoney(netIncome) + ' ' + unit;
            document.getElementById('taxAmount').innerText = formatMoney(tax);
        }
    </script>
</body>
</html>
