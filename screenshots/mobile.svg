<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#151e2e"/>
    </linearGradient>
    <linearGradient id="mChartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0d9488" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#mobBg)"/>

  <!-- Mobile Topbar -->
  <rect width="390" height="58" fill="#1e293b" opacity="0.95"/>
  <line x1="0" y1="58" x2="390" y2="58" stroke="#334155" stroke-width="1"/>

  <text x="16" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800" fill="#f8fafc">💰 MoneyApp</text>

  <!-- Topbar Badges & Actions -->
  <g transform="translate(160, 18)">
    <!-- Offline status -->
    <rect width="84" height="22" rx="11" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <circle cx="10" cy="11" r="3.5" fill="#34d399"/>
    <text x="19" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#a7f3d0">Offline Ready</text>

    <!-- Language Toggle -->
    <rect x="92" y="0" width="56" height="22" rx="11" fill="#334155"/>
    <rect x="120" y="0" width="28" height="22" rx="11" fill="#0d9488"/>
    <text x="100" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#94a3b8">TH</text>
    <text x="127" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff">EN</text>

    <!-- Settings Gear -->
    <circle cx="164" cy="11" r="11" fill="#334155"/>
    <text x="160" y="15" font-size="11">⚙️</text>
  </g>

  <!-- Privacy Banner -->
  <rect x="16" y="70" width="358" height="32" rx="6" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
  <text x="26" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🔒 100% Client-Side Privacy (Local Only)</text>

  <!-- Main KPI Card: Net Worth -->
  <g transform="translate(16, 114)">
    <rect width="358" height="110" rx="12" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1" filter="url(#mGlow)"/>
    <text x="18" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">NET WORTH (ความมั่งคั่งสุทธิ)</text>
    <text x="18" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#2dd4bf">฿2,450,000</text>
    <rect x="18" y="80" width="60" height="18" rx="9" fill="#064e3b"/>
    <text x="25" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">▲ +14.2%</text>
    <text x="86" y="93" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">vs last year</text>
  </g>

  <!-- 2x2 Mini KPI Grid -->
  <!-- Cash Flow -->
  <g transform="translate(16, 236)">
    <rect width="173" height="82" rx="10" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MONTHLY SURPLUS</text>
    <text x="14" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#38bdf8">฿38,500</text>
    <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Rate: 42.8%</text>
  </g>

  <!-- Runway -->
  <g transform="translate(201, 236)">
    <rect width="173" height="82" rx="10" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">EMERGENCY RUNWAY</text>
    <text x="14" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#facc15">14.6 Mos</text>
    <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#34d399">✓ SAFE (&gt;6M)</text>
  </g>

  <!-- Total Debt -->
  <g transform="translate(16, 328)">
    <rect width="173" height="82" rx="10" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">TOTAL DEBT</text>
    <text x="14" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#f87171">฿180,000</text>
    <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Snowball: 11 mos left</text>
  </g>

  <!-- Health Score -->
  <g transform="translate(201, 328)">
    <rect width="173" height="82" rx="10" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8">FINANCIAL HEALTH</text>
    <text x="14" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" fill="#a78bfa">92 / 100</text>
    <text x="14" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#c084fc">EXCELLENT</text>
  </g>

  <!-- Growth Trend Mini Chart -->
  <g transform="translate(16, 420)">
    <rect width="358" height="175" rx="12" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">📈 Net Worth Growth Curve</text>

    <!-- Mini chart curve -->
    <path d="M 30 135 Q 100 115, 170 95 T 328 55 L 328 145 L 30 145 Z" fill="url(#mChartGrad)"/>
    <path d="M 30 135 Q 100 115, 170 95 T 328 55" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <circle cx="328" cy="55" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>

    <g font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">
      <text x="40" y="160">Jan 25</text>
      <text x="180" y="160">Jan 26</text>
      <text x="320" y="160">Oct 26</text>
    </g>
  </g>

  <!-- Goal Progress List -->
  <g transform="translate(16, 606)">
    <rect width="358" height="150" rx="12" fill="url(#mCardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">🎯 Financial Goals Progress</text>

    <g transform="translate(16, 42)">
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Emergency Fund (6 Months) — 100%</text>
      <rect x="0" y="18" width="326" height="8" rx="4" fill="#334155"/>
      <rect x="0" y="18" width="326" height="8" rx="4" fill="#10b981"/>

      <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Retirement Pool Max (ม.47) — 76%</text>
      <rect x="0" y="50" width="326" height="8" rx="4" fill="#334155"/>
      <rect x="0" y="50" width="248" height="8" rx="4" fill="#0d9488"/>

      <text x="0" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#cbd5e1">Home Downpayment Fund — 58%</text>
      <rect x="0" y="82" width="326" height="8" rx="4" fill="#334155"/>
      <rect x="0" y="82" width="189" height="8" rx="4" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Mobile Bottom Nav -->
  <g transform="translate(0, 774)">
    <rect width="390" height="70" fill="#1e293b"/>
    <line x1="0" y1="0" x2="390" y2="0" stroke="#334155" stroke-width="1"/>

    <!-- Tab 1: Home (Active) -->
    <g transform="translate(39, 14)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <text x="0" y="16" font-size="18">🏠</text>
      <text x="0" y="32" font-size="10" font-weight="700" fill="#2dd4bf">Home</text>
    </g>

    <!-- Tab 2: Rebalance -->
    <g transform="translate(117, 14)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <text x="0" y="16" font-size="18">⚖️</text>
      <text x="0" y="32" font-size="10" font-weight="600" fill="#94a3b8">Rebalance</text>
    </g>

    <!-- Tab 3: Payslip -->
    <g transform="translate(195, 14)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <text x="0" y="16" font-size="18">📑</text>
      <text x="0" y="32" font-size="10" font-weight="600" fill="#94a3b8">Payslip</text>
    </g>

    <!-- Tab 4: Tax -->
    <g transform="translate(273, 14)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <text x="0" y="16" font-size="18">🧾</text>
      <text x="0" y="32" font-size="10" font-weight="600" fill="#94a3b8">Tax</text>
    </g>

    <!-- Tab 5: PVD -->
    <g transform="translate(351, 14)" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      <text x="0" y="16" font-size="18">💼</text>
      <text x="0" y="32" font-size="10" font-weight="600" fill="#94a3b8">PVD</text>
    </g>
  </g>
</svg>
